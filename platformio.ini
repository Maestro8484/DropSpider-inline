; DropSpider, Mechanism A (In-Line Single-Axle Clutch Spool), Rev C
;
; Open this folder in VS Code with the PlatformIO extension and it finds this file.
; Build is the check mark on the bottom bar, upload is the arrow next to it.
;
; Two ways to load firmware:
;   nodemcu-32s   over the USB cable (COM13 on the bench PC)
;   ota           over the home network, once the board is on it
;
; Network name, network password and the update password live in secrets.ini,
; which is kept out of git. Copy secrets.ini.example to secrets.ini first.

[platformio]
name = DropSpider inline
description = Ceiling drop-spider, stepper rewind through a one-way clutch, servo finger lock, radar trigger
default_envs = nodemcu-32s
extra_configs = secrets.ini

[env]
; Pinned so a rebuild next year gets the same compiler and core.
; 6.7.0 = Arduino core 2.0.16. Core 3.x (platform 7+) is not tested.
platform = espressif32@6.7.0
; In use: 30-pin ESP32 DevKit V1 (ESP-WROOM-32, CP2102 USB). The 38-pin NodeMCU-32S
; runs the same build. Both are ESP32-D0WD-V3 with 4 MB flash, read by esptool.
board = nodemcu-32s
framework = arduino
board_build.partitions = min_spiffs.csv   ; two app slots, needed for network updates
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
lib_deps =
    madhephaestus/ESP32Servo @ 3.0.6
    gin66/FastAccelStepper @ 0.33.14
build_flags =
    -Wall
    '-D WIFI_SSID="${secrets.wifi_ssid}"'
    '-D WIFI_PASS="${secrets.wifi_pass}"'
    '-D OTA_PASS="${secrets.ota_pass}"'

[env:nodemcu-32s]
upload_port = COM13
monitor_port = COM13
upload_speed = 460800

[env:ota]
upload_protocol = espota
upload_port = dropspider.local
upload_flags = --auth=${secrets.ota_pass}
