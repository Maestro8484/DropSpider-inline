<text fill="#0000ff" font-family="Arial" font-size="2.4" x="36.000" y="26.000">FAIRLEAD BLOCK: 2x M3</text>
<text fill="#0000ff" font-family="Arial" font-size="2.4" x="62.000" y="51.500">LINE</text>
<text fill="#0000ff" font-family="Arial" font-size="2.4" x="11.000" y="42.000">RADAR FORK: 2x M3</text>
<text fill="#0000ff" font-family="Arial" font-size="2.2" x="117.000" y="40.000">Distances to each hole's centre, in mm,</text>
<text fill="#0000ff" font-family="Arial" font-size="2.2" x="117.000" y="43.000">from the servo-side edge (left) and</text>
<text fill="#0000ff" font-family="Arial" font-size="2.2" x="117.000" y="46.000">from the motor end (top):</text>
<text fill="#0000ff" font-family="Arial" font-size="2.2" x="117.000" y="49.000">line: 50 in, 45 down</text>
<text fill="#0000ff" font-family="Arial" font-size="2.2" x="117.000" y="52.000">fairlead block: 43 in, 28 and 83 down</text>
<text fill="#0000ff" font-family="Arial" font-size="2.2" x="117.000" y="55.000">radar fork: 13 in, 45 and 79 down</text>
<text fill="#0000ff" font-family="Arial" font-size="2.2" x="117.000" y="58.000">LASER PLATE: every M3 hole cut 5.5 mm,</text>
<text fill="#0000ff" font-family="Arial" font-size="2.2" x="117.000" y="61.000">room for an M3 screw or an M3 heat-set</text>
<text fill="#0000ff" font-family="Arial" font-size="2.2" x="117.000" y="64.000">insert up to 5 mm across; the line 8 mm.</text>
<text fill="#0000ff" font-family="Arial" font-size="2.2" x="117.000" y="67.000">DRILLING THE PRINTED BASE instead: M3</text>
<text fill="#0000ff" font-family="Arial" font-size="2.2" x="117.000" y="70.000">holes 3.4 mm, the line 7 mm.</text>
<text fill="#0000ff" font-family="Arial" font-size="2.2" x="117.000" y="73.000">Dashed blue: where fairlead v2 and the</text>
<text fill="#0000ff" font-family="Arial" font-size="2.2" x="117.000" y="76.000">radar fork sit. Red circles with no cross:</text>
<text fill="#0000ff" font-family="Arial" font-size="2.2" x="117.000" y="79.000">the bracket's own holes (pad, ceiling).</text>
