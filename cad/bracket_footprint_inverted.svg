<text fill="#0000ff" font-family="Arial" font-size="2.4" x="5.000" y="128.500">DropSpider bracket base, outer face seen from outside (from below when hung). 1:1 mm. Red = cut (laser plate sizes). Crosses = the five holes the inverted install adds. Brace holes are the owner's.</text>
